<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ender-3 V3 KE Kamera</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #durum { position: fixed; left: 8px; bottom: 6px; color: #aaa; font: 12px sans-serif; }
</style>
</head>
<body>
<img id="kare" alt="">
<div id="durum">bağlanıyor…</div>
<script>
// Logitech webcams send MJPEG frames without Huffman tables (DHT). Chrome tolerates that,
// WebKit (Safari, OrcaSlicer's Device tab) does not. Fetch snapshots from this mjpg_streamer,
// insert the standard tables (ITU T.81 K.3) when missing, and show them as blobs.
const DHT = new Uint8Array((
  "FFC401A2" +
  "0000010501010101010100000000000000000102030405060708090A0B" +
  "0100030101010101010101010000000000000102030405060708090A0B" +
  "100002010303020403050504040000017D" +
  "01020300041105122131410613516107227114328191A1082342B1C11552D1F02433627282090A161718191A25262728292A3435363738393A434445464748494A535455565758595A636465666768696A737475767778797A838485868788898A92939495969798999AA2A3A4A5A6A7A8A9AAB2B3B4B5B6B7B8B9BAC2C3C4C5C6C7C8C9CAD2D3D4D5D6D7D8D9DAE1E2E3E4E5E6E7E8E9EAF1F2F3F4F5F6F7F8F9FA" +
  "1100020102040403040705040400010277" +
  "000102031104052131061241510761711322328108144291A1B1C109233352F0156272D10A162434E125F11718191A262728292A35363738393A434445464748494A535455565758595A636465666768696A737475767778797A82838485868788898A92939495969798999AA2A3A4A5A6A7A8A9AAB2B3B4B5B6B7B8B9BAC2C3C4C5C6C7C8C9CAD2D3D4D5D6D7D8D9DAE2E3E4E5E6E7E8E9EAF2F3F4F5F6F7F8F9FA"
).match(/../g).map(h => parseInt(h, 16)));

const FPS = 5;
const kare = document.getElementById("kare");
const durum = document.getElementById("durum");
let eskiUrl = null;

function tabloEkle(b) {
  // find the first marker that is DHT (FFC4) or SOS (FFDA)
  for (let i = 2; i < b.length - 1; i++) {
    if (b[i] !== 0xFF) continue;
    if (b[i + 1] === 0xC4) return b;           // already has Huffman tables
    if (b[i + 1] === 0xDA) {                   // start of scan without tables: insert before it
      const out = new Uint8Array(b.length + DHT.length);
      out.set(b.subarray(0, i), 0);
      out.set(DHT, i);
      out.set(b.subarray(i), i + DHT.length);
      return out;
    }
  }
  return b;
}

async function dongu() {
  const basla = performance.now();
  try {
    const r = await fetch("./?action=snapshot&t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const b = tabloEkle(new Uint8Array(await r.arrayBuffer()));
    const url = URL.createObjectURL(new Blob([b], { type: "image/jpeg" }));
    kare.onload = () => { if (eskiUrl) URL.revokeObjectURL(eskiUrl); eskiUrl = url; };
    kare.src = url;
    durum.textContent = new Date().toLocaleTimeString("tr-TR");
  } catch (e) {
    durum.textContent = "kamera yok: " + e.message;
  }
  setTimeout(dongu, Math.max(0, 1000 / FPS - (performance.now() - basla)));
}
dongu();
</script>
</body>
</html>
